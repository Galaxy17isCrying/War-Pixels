name: Build War Pixels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --name WarPixels --windowed --onefile --add-data "data;data" --add-data "assets/audio/menu.mp3;assets/audio" main.py
      - run: Compress-Archive -Path dist\WarPixels.exe -DestinationPath WarPixels-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WarPixels-Windows
          path: WarPixels-Windows.zip

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - run: python -m venv .buildozer-venv
      - run: .buildozer-venv/bin/python -m pip install --upgrade pip setuptools wheel
      - run: .buildozer-venv/bin/python -m pip install buildozer cython==0.29.36
      - run: .buildozer-venv/bin/buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: WarPixels-Android
          path: bin/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/WarPixels-Windows/WarPixels-Windows.zip
            release-files/WarPixels-Android/*.apk
